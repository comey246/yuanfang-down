name: Sync down market quotes

on:
  schedule:
    - cron: "20 1 * * *"
  workflow_dispatch:

concurrency:
  group: sync-down-market-quotes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch public quotes and update production
        env:
          MARKET_SYNC_SECRET: ${{ secrets.MARKET_SYNC_SECRET }}
        run: node down-material-b2b/scripts/push-cn-down-market.mjs

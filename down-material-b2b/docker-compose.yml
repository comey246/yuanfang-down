services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: down_user
      POSTGRES_PASSWORD: down_password
      POSTGRES_DB: down_factory
    ports:
      - "5432:5432"
    volumes:
      - down_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U down_user -d down_factory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  down_postgres_data:

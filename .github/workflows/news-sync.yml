name: Sync down industry news

on:
  schedule:
    - cron: "50 1 * * *"
  workflow_dispatch:

concurrency:
  group: sync-down-industry-news
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch official industry news and update production
        env:
          NEWS_SYNC_SECRET: ${{ secrets.MARKET_SYNC_SECRET }}
        run: node down-material-b2b/scripts/push-down-news.mjs
